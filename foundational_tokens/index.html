<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="main.css">

        <title>Font Example</title>
    </head>
    <body>
        <p class="primary"><em>This is Primary Font Italic</em></p>
        <p class="primary light base">This is Primary Light Baseline</p>
        <br>

        <p class="primary light minusOne uniBlue">This is Primary Light uniBlue -1</p>
        <p class="primary light plusOne uniBlue80">This is Primary Light uniBlue80 +1</p>
        <p class="primary rust light plusFour">This is Primary Light Rust +4</p>
        <p class="primary light error plusNine">This is Primary Light Error +9</p>


        <br>
        <p class="secondary">This is Secondary Font</p>
        <p class="secondary bold">This is Secondary Bold</p>

</html>
